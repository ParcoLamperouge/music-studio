[project]
name = "estudio-engine"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "audio-separator>=0.47.0",
    "audioread>=3.1.0",
    "basic-pitch[onnx]>=0.4",
    "beat-this>=1.0",
    "lv-chordia>=1.1.0",
    # muscriptor pins torch<2.3 and is GPU/ROCm-only: excluded on macOS (basic-pitch covers transcription)
    "muscriptor>=0.3.0; sys_platform == 'linux'",
    "music21>=10.5.0",
    "onnxruntime>=1.30.0",
    "openai-whisper>=20250625",
    "pyphen>=0.18.1",
    "torch>=2.14.1",
    "torchaudio>=2.11.0",
    "yt-dlp>=2026.8.19",
]

[tool.uv.sources]
# ROCm wheels are Linux-only; on macOS fall back to the default index (PyPI, CPU/MPS build)
torch = [{ index = "pytorch-rocm", marker = "sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-rocm", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true

[tool.uv]
# basic-pitch pide tensorflow<2.15 (no existe para Python 3.13) y resampy<0.4.3 (choca con
# audio-separator). Usamos su modelo ONNX con onnxruntime, así que ninguno hace falta.
# whisper pide `triton` (CUDA); torch ROCm ya trae triton-rocm.
override-dependencies = ["triton; sys_platform == 'never'", "tensorflow; sys_platform == 'never'", "tensorflow-macos; sys_platform == 'never'", "resampy>=0.4"]
# macOS port: resolve for darwin only (the upstream linux/ROCm resolution needs
# download.pytorch.org/whl/rocm7.2, unreachable from here)
environments = ["sys_platform == 'darwin'"]
