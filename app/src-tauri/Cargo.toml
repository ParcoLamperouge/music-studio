[package]
name = "estudio"
version = "0.1.0"
description = "Letras, pistas, partituras y edits de cada canción en una sola app"
authors = ["wDona"]
edition = "2021"

[lib]
name = "estudio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
midir = "0.11.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
